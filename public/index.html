<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193b37">
  <meta name="description" content="高校生がテスト前のつまずきと小さなヒントを交換できる、放課後の学習掲示板。">
  <title>放課後ヒント部 | 高校生の学習掲示板</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><div class="wrap bar"><a href="/" class="brand" aria-label="放課後ヒント部 ホーム"><span class="mark" aria-hidden="true">?</span>放課後ヒント部</a><a class="boardlink" href="#board">掲示板を見る ↓</a></div></header>
  <main class="wrap">
    <section class="hero" aria-labelledby="heroTitle">
      <div><p class="eyebrow">テスト前の学習掲示板</p><h1 id="heroTitle">その「わからない」、<br>ひとつずつ。</h1>
      <p class="lead">つまずいた問題を選んで質問。<br class="mobile">届いたヒントは、読みたい分だけ開けます。</p>
      <button class="primary" id="compose" type="button" disabled><b aria-hidden="true">＋</b> 質問を出す</button></div>
      <div class="illustration" aria-hidden="true"><div class="paper back"></div><div class="paper front"><div class="paperhead"><i></i><span>数学ノート</span></div><div class="math">x² + 6x + 5</div><div class="pencil"></div><div class="hole"></div></div><span class="note">カッコの中から！</span></div>
    </section>
    <section class="board" id="board" aria-labelledby="boardTitle">
      <div class="sectionhead"><div><span class="eyebrow">質問とヒント</span><h2 id="boardTitle">みんなの掲示板</h2></div><button class="refresh" id="refresh" type="button">↻ 一覧を更新</button></div>
      <fieldset class="filters"><legend class="sr">科目で絞り込み</legend><div id="subjects" class="chips"></div></fieldset>
      <div class="counts"><p id="total" aria-live="polite">読み込み中…</p><label><input type="checkbox" id="waiting"> ヒント待ちだけ</label></div>
      <p id="status" role="status" hidden></p><div id="cards" class="cards"></div>
      <noscript>掲示板の質問を表示するには、ブラウザのJavaScriptを有効にしてください。</noscript>
    </section>
  </main>
  <footer><div class="wrap">放課後ヒント部<span>質問の掲載期間は7日間です。</span></div></footer>
  <dialog id="panel" aria-labelledby="dialogTitle"><div class="dialogtop"><span class="eyebrow" id="dialogTag"></span><button id="close" type="button" aria-label="閉じる">×</button></div><h2 id="dialogTitle"></h2><div id="dialogBody"></div><p id="dialogStatus" role="status" hidden></p></dialog>
</body>
</html>
