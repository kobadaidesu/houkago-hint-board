<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="高校生がテスト前のつまずきと小さなヒントを交換できる、放課後の学習掲示板。">
  <title>放課後ヒント部 | 高校生の学習掲示板</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="wrap bar" aria-label="メインナビゲーション">
      <a class="brand" href="/" aria-label="放課後ヒント部 ホーム">
        <span class="brandmark" aria-hidden="true"><i></i></span>放課後ヒント部
      </a>
      <a class="navlink" href="#board">掲示板を見る <i class="chevron down" aria-hidden="true"></i></a>
    </nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="wrap hero-inner">
        <div class="hero-copy">
          <p class="kicker">高校生のための学習掲示板</p>
          <h1 id="heroTitle"><span>その「わからない」、</span><span class="accent">ひとつずつ。</span></h1>
          <p class="lead">つまずいた問題を選んで、質問しよう。<br>届いたヒントは、読みたい分だけ開けます。</p>
          <button class="primary" id="compose" type="button" disabled><i class="plus" aria-hidden="true"></i>質問を出す</button>
        </div>
        <div class="art" aria-hidden="true">
          <img src="/hint-plane.webp" width="1160" height="773" alt="" fetchpriority="high">
        </div>
      </div>
    </section>
    <section class="board" id="board" aria-labelledby="boardTitle">
      <div class="wrap">
        <div class="sectionhead">
          <div class="headinggroup">
            <h2 id="boardTitle">みんなの掲示板</h2>
            <p id="total" aria-live="polite">読み込み中…</p>
          </div>
          <button class="refresh" id="refresh" type="button"><i aria-hidden="true">↻</i>一覧を更新</button>
        </div>
        <div class="toolbar">
          <fieldset class="filters">
            <legend class="sr">科目で絞り込み</legend>
            <div id="subjects" class="chips"></div>
          </fieldset>
          <label class="switch-label"><input type="checkbox" id="waiting"><span class="switch" aria-hidden="true"></span>ヒント待ちだけ</label>
        </div>
        <p id="status" role="status" hidden></p>
        <div id="cards" class="cards"></div>
        <noscript>掲示板の質問を表示するには、ブラウザのJavaScriptを有効にしてください。</noscript>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><strong>放課後ヒント部</strong><span>質問の掲載期間は7日間です。</span></div></footer>
  <dialog id="panel" aria-labelledby="dialogTitle">
    <div class="dialogtop"><span id="dialogTag"></span><button id="close" type="button" aria-label="閉じる"><i class="plus" aria-hidden="true"></i></button></div>
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody"></div>
    <p id="dialogStatus" role="status" hidden></p>
  </dialog>
</body>
</html>
